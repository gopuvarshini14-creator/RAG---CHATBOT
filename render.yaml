# render.yaml — Infrastructure as Code for Render.com
# Deploy with: render deploy
# Or connect your GitHub repo at https://dashboard.render.com

services:
  # ─── Backend API ─────────────────────────────────────────
  - type: web
    name: rag-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter  # Free tier: 512MB RAM, sleeps after 15min inactivity
                   # Upgrade to "standard" for always-on

    envVars:
      - key: OPENAI_API_KEY
        sync: false          # Set manually in Render dashboard (secret)
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: VECTOR_STORE_TYPE
        value: chroma
      - key: CHROMA_PERSIST_DIR
        value: /opt/render/project/src/chroma_db
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
      - key: ALLOWED_ORIGINS
        value: '["https://your-frontend.vercel.app"]'

    # Persistent disk for ChromaDB and uploads
    disk:
      name: rag-data
      mountPath: /opt/render/project/src/chroma_db
      sizeGB: 1

    healthCheckPath: /api/health

  # ─── (Optional) Static Site via Render ──────────────────
  # Alternatively deploy frontend to Vercel (recommended)
